[project]
name = "obs-platform"
version = "0.1.0"
description = "Observatory platform modules: ingestion, models, simulation, analytics, tools."
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pip-system-certs>=5.3",
    "polymarket-client>=0.10.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_platform"]
